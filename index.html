<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base Lunar — Junior Astronaut Mission Trainer</title>
<style>
  :root { --bg:#070b1a; --panel:#141c33; --line:#2b3a63; --text:#f4f6fb; --muted:#a9b6d6;
          --air:#38bdf8; --pw:#facc15; --rad:#f87171; --sci:#4ade80; --card:#fdf6e3; --ink:#1b2340; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; font-family: ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif; color:var(--text);
         background:radial-gradient(ellipse at top, #1a2550, var(--bg) 65%) fixed; overflow-x:hidden; }
  main { max-width:460px; margin:0 auto; padding:.6rem .8rem 1.2rem; min-height:100%; display:flex; flex-direction:column; gap:.6rem; }
  .hidden { display:none !important; }
  button { font:inherit; border:none; cursor:pointer; color:var(--ink); font-weight:800; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  a { color:#7dd3fc; }

  /* ---------- topo ---------- */
  .top { display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .top .day { font-weight:800; font-size:1rem; }
  .top .date { color:var(--muted); font-size:.85rem; }
  .lang { background:#22305a; color:var(--text); border-radius:999px; padding:.35rem .8rem; font-size:.85rem; }

  /* ---------- cena ---------- */
  .scene { position:relative; height:150px; border-radius:22px; overflow:hidden; border:2px solid var(--line);
           background:
             radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 55% 18%, #fff 50%, transparent 51%),
             radial-gradient(1.5px 1.5px at 78% 40%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 38% 55%, #fff 50%, transparent 51%),
             radial-gradient(1px 1px at 90% 12%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 66% 60%, #fff 50%, transparent 51%),
             linear-gradient(#040714, #131c3f); }
  .sun { position:absolute; left:16px; top:14px; width:46px; height:46px; border-radius:50%;
         background:radial-gradient(#fffbe0, #fbbf24 70%); box-shadow:0 0 calc(var(--sun,2) * 12px) calc(var(--sun,2) * 4px) rgba(251,191,36,.55);
         opacity:calc(.45 + var(--sun,2) * .14); transform:scale(calc(.7 + var(--sun,2) * .1)); transition:all .6s; }
  .scene.storm .sun { animation:flare .5s ease-in-out 3; }
  @keyframes flare { 50% { box-shadow:0 0 60px 26px rgba(255,120,60,.9); background:radial-gradient(#fff, #fb7185 70%); } }
  .ground { position:absolute; left:-12%; bottom:-78px; width:124%; height:124px; border-radius:50%;
            background:radial-gradient(ellipse 26px 7px at 22% 14%, #6f758b 60%, transparent 62%), radial-gradient(ellipse 18px 5px at 44% 22%, #6f758b 60%, transparent 62%),
                       radial-gradient(ellipse 22px 6px at 88% 16%, #6f758b 60%, transparent 62%), #9aa0b5; }
  .base { position:absolute; right:22%; bottom:40px; width:84px; height:42px; border-radius:84px 84px 0 0; background:linear-gradient(#eef2ff, #b9c4e6);
          display:flex; align-items:flex-end; justify-content:center; font-size:1.5rem; line-height:1.2; transition:background .3s; }
  .base.hit { animation:hit .35s 4; }
  @keyframes hit { 50% { background:#fb7185; } }
  .shield { position:absolute; right:calc(22% - 26px); bottom:40px; width:136px; height:68px; border-radius:136px 136px 0 0;
            border:3px dashed rgba(125,211,252,.22); border-bottom:none; transition:all .4s; }
  .shield.ready { border:4px solid #67e8f9; border-bottom:none; background:rgba(103,232,249,.14); box-shadow:0 0 22px 4px rgba(103,232,249,.7); }
  .shield.rush  { border:3px solid #fde047; border-bottom:none; background:rgba(253,224,71,.08); box-shadow:0 0 12px 2px rgba(253,224,71,.5); }
  .rover { position:absolute; left:26%; bottom:38px; font-size:1.5rem; transition:opacity .4s, transform .6s; opacity:0; transform:translateX(60px) scaleX(-1); }
  .rover.out { opacity:1; transform:translateX(0) scaleX(-1); }
  .particle { position:absolute; left:0; top:0; width:6px; height:6px; border-radius:50%; background:#fb923c; box-shadow:0 0 6px 2px #f97316; pointer-events:none; }
  .toast { position:absolute; left:0; right:0; top:8px; text-align:center; font-weight:800; font-size:.95rem; text-shadow:0 2px 6px #000; pointer-events:none; opacity:0; transition:opacity .3s; }
  .toast.show { opacity:1; }

  /* ---------- medidores ---------- */
  .meters { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:.45rem; align-items:stretch; }
  .meter { position:relative; background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:.35rem .45rem .45rem; transition:border-color .2s, transform .2s; }
  .meter .ico { font-size:1.15rem; line-height:1; display:flex; justify-content:space-between; align-items:center; }
  .meter .ico small { font-size:.68rem; color:var(--muted); font-weight:700; }
  .bar { height:12px; background:#26314f; border-radius:8px; overflow:hidden; margin-top:.3rem; }
  .bar > div { height:100%; border-radius:8px; transition:width .5s, background .3s; }
  .meter.low { animation:low 1s ease-in-out infinite; }
  @keyframes low { 50% { border-color:#f87171; } }
  .meter .pv { position:absolute; right:6px; top:-10px; font-size:.8rem; font-weight:900; padding:0 .3rem; border-radius:8px; opacity:0; transition:opacity .15s; }
  .meter.up .pv, .meter.down .pv { opacity:1; }
  .meter.up, .meter.down { transform:translateY(-2px); border-color:#fff; }
  .pv.good { background:#14532d; color:#86efac; } .pv.bad { background:#7f1d1d; color:#fca5a5; }
  .sci { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:58px; }
  .sci b { font-size:1.15rem; } .sci small { font-size:.68rem; color:var(--muted); }

  /* ---------- carta ---------- */
  .deck { position:relative; flex:1; min-height:250px; display:flex; align-items:center; justify-content:center; touch-action:pan-y; }
  .card { position:relative; width:100%; max-width:330px; min-height:240px; background:var(--card); color:var(--ink); border-radius:24px; padding:1rem 1.1rem 1.1rem;
          box-shadow:0 10px 0 #cbbf9a, 0 18px 30px rgba(0,0,0,.45); text-align:center; user-select:none; cursor:grab; touch-action:none;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; will-change:transform; }
  .card.snap { transition:transform .25s ease-out; }
  .card.fly { transition:transform .3s ease-in, opacity .3s; opacity:0; }
  .card.in { animation:cardIn .28s ease-out; }
  @keyframes cardIn { from { transform:translateY(24px) scale(.94); opacity:0; } }
  .card.shake { animation:shake .3s; }
  @keyframes shake { 25% { transform:translateX(-10px); } 75% { transform:translateX(10px); } }
  .card .art { font-size:3.4rem; line-height:1.1; }
  .card .txt { font-size:1.08rem; line-height:1.35; font-weight:700; }
  .card .note { font-size:.8rem; color:#5b6485; font-weight:700; }
  .card .real { font-size:.74rem; font-weight:800; background:#1b2340; color:#fde68a; border-radius:999px; padding:.2rem .65rem; }
  .card.alert { background:#fff1f1; box-shadow:0 10px 0 #f3a3a3, 0 18px 30px rgba(0,0,0,.45); }
  .tag { position:absolute; top:12px; font-size:.82rem; font-weight:900; padding:.25rem .6rem; border-radius:10px; opacity:0; color:#fff; max-width:60%; }
  .tag.l { right:12px; background:#475569; transform:rotate(6deg); } .tag.r { left:12px; background:#0284c7; transform:rotate(-6deg); }

  .card.hint { animation:nudge 1.5s ease-in-out .6s 2; }
  @keyframes nudge { 20% { transform:translateX(26px) rotate(3deg); } 50% { transform:translateX(-26px) rotate(-3deg); } 80% { transform:none; } }
  .learn { min-height:3.4rem; background:#12203f; border:2px dashed #33508f; border-radius:14px; padding:.45rem .7rem; font-size:.84rem; line-height:1.35;
           opacity:0; transition:opacity .35s; display:flex; align-items:center; }
  .learn.show { opacity:1; }
  .learn.disc { border-color:var(--sci); background:#0f2a1e; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .choices.single { grid-template-columns:1fr; }
  .choice { border-radius:16px; padding:.6rem .5rem; background:#e2e8f0; font-size:.95rem; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.2rem; box-shadow:0 4px 0 #94a3b8; }
  .choice:active { transform:translateY(3px); box-shadow:0 1px 0 #94a3b8; }
  .choice.r { background:#7dd3fc; box-shadow:0 4px 0 #0284c7; }
  .choice .fx { font-size:.82rem; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
  .choice:disabled { opacity:.45; cursor:not-allowed; }
  .hintSwipe { text-align:center; color:var(--muted); font-size:.78rem; margin:-.2rem 0 0; }

  /* ---------- telas ---------- */
  .panel { background:var(--panel); border:2px solid var(--line); border-radius:22px; padding:1.1rem; }
  .panel h1 { font-size:1.5rem; margin:.2rem 0 .5rem; } .panel h2 { font-size:1.1rem; margin:1rem 0 .4rem; }
  .panel p { line-height:1.45; margin:.5rem 0; }
  .hero { font-size:3rem; text-align:center; letter-spacing:.3rem; }
  .how { display:grid; gap:.4rem; margin:.7rem 0; padding:0; list-style:none; }
  .how li { background:#0e1630; border-radius:12px; padding:.5rem .7rem; font-weight:700; }
  .fact { background:#1e293b; border-left:5px solid var(--air); border-radius:10px; padding:.6rem .8rem; font-size:.92rem; margin:.7rem 0; }
  .big { display:block; width:100%; font-size:1.2rem; padding:.9rem 1rem; border-radius:16px; background:#38bdf8; box-shadow:0 5px 0 #0369a1; margin-top:.8rem; }
  .big:active { transform:translateY(3px); box-shadow:0 2px 0 #0369a1; }
  .stars { font-size:2.4rem; text-align:center; letter-spacing:.25rem; }
  .sum { display:flex; justify-content:center; gap:.8rem; font-weight:800; flex-wrap:wrap; }
  .ev { background:#0e1630; border-radius:14px; padding:.65rem .8rem; margin:.5rem 0; font-size:.9rem; line-height:1.4; }
  .ev .when { font-weight:800; color:#fde68a; }
  .ev .you { margin-top:.35rem; padding-top:.35rem; border-top:1px dashed var(--line); }
  .debrief { list-style:none; padding:0; margin:.6rem 0; display:grid; gap:.4rem; }
  .debrief li { background:#0e1630; border-radius:12px; padding:.5rem .7rem; font-size:.92rem; line-height:1.35; }
  .book { display:grid; gap:.4rem; }
  .book .d { display:grid; grid-template-columns:auto 1fr; gap:.1rem .6rem; background:#0f2a1e; border-radius:12px; padding:.5rem .7rem; font-size:.88rem; line-height:1.35; }
  .book .d .i { grid-row:span 2; font-size:1.6rem; align-self:center; }
  .book .d b { color:#86efac; }
  .coll { color:var(--muted); font-size:.85rem; font-weight:700; }
  details { margin-top:1rem; font-size:.9rem; } summary { cursor:pointer; font-weight:800; }
  footer { color:var(--muted); font-size:.75rem; text-align:center; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>

<!-- ===================== INÍCIO ===================== -->
<section id="intro" class="panel">
  <div style="text-align:right"><button class="lang" data-lang></button></div>
  <div class="hero" aria-hidden="true">🌑🧑‍🚀☀️</div>
  <h1 data-t="title"></h1>
  <p data-t="intro1"></p>
  <ul class="how">
    <li data-t="how1"></li>
    <li data-t="how2"></li>
    <li data-t="how3"></li>
    <li data-t="how4"></li>
  </ul>
  <div class="fact" data-t="introReal"></div>
  <button class="big" id="startBtn" data-t="start"></button>
</section>

<!-- ===================== JOGO ===================== -->
<section id="game" class="hidden" style="display:flex; flex-direction:column; gap:.6rem; flex:1">
  <div class="top">
    <div><div class="day" id="dayTxt"></div><div class="date" id="dateTxt"></div></div>
    <div style="display:flex; gap:.4rem"><button class="lang" id="muteBtn" aria-label="Som / Sound"></button><button class="lang" data-lang></button></div>
  </div>

  <div class="scene" id="scene" aria-hidden="true">
    <div class="sun" id="sun"></div>
    <div class="ground"></div>
    <div class="rover" id="rover">🚙</div>
    <div class="shield" id="shield"></div>
    <div class="base" id="base">🧑‍🚀</div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="meters">
    <div class="meter" id="m_air"><div class="ico"><span>🫧</span><small data-t="mAir"></small></div><div class="bar"><div id="b_air" style="background:var(--air)"></div></div><span class="pv"></span></div>
    <div class="meter" id="m_pw"><div class="ico"><span>⚡</span><small data-t="mPw"></small></div><div class="bar"><div id="b_pw" style="background:var(--pw)"></div></div><span class="pv"></span></div>
    <div class="meter" id="m_rad"><div class="ico"><span>☢️</span><small data-t="mRad"></small></div><div class="bar"><div id="b_rad" style="background:var(--rad)"></div></div><span class="pv"></span></div>
    <div class="meter sci" id="m_sci"><b>🔬 <span id="sciTxt">0</span></b><small data-t="mSci"></small><span class="pv"></span></div>
  </div>

  <div class="deck" id="deck">
    <div class="card" id="card" tabindex="0" role="group" aria-live="polite">
      <span class="tag l" id="tagL"></span><span class="tag r" id="tagR"></span>
      <div class="art" id="cArt" aria-hidden="true"></div>
      <div class="txt" id="cTxt"></div>
      <div class="note" id="cNote"></div>
      <div class="real hidden" id="cReal"></div>
    </div>
  </div>

  <div class="learn" id="learn" aria-live="polite"></div>

  <div class="choices" id="choices">
    <button class="choice l" id="btnL"></button>
    <button class="choice r" id="btnR"></button>
  </div>
  <p class="hintSwipe" data-t="swipe"></p>
</section>

<!-- ===================== FIM ===================== -->
<section id="end" class="panel hidden" aria-live="polite">
  <div style="text-align:right"><button class="lang" data-lang></button></div>
  <div class="hero" id="endArt" aria-hidden="true"></div>
  <h1 id="endTitle" style="text-align:center"></h1>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="sum" id="endSum"></div>
  <p id="endText"></p>
  <ul class="debrief" id="debrief"></ul>
  <button class="big" id="againBtn" data-t="again"></button>
  <div class="fact" id="endFact"></div>
  <h2 id="bookTitle"></h2>
  <p class="coll" id="bookColl"></p>
  <div class="book" id="book"></div>
  <h2 data-t="realTitle"></h2>
  <p id="realIntro"></p>
  <div id="realList"></div>
  <details>
    <summary data-t="srcTitle"></summary>
    <div id="srcBody"></div>
  </details>
</section>

<footer data-t="footer"></footer>
</main>

function pickMission() {
  // Janela real de 10 dias com pelo menos uma tempestade (nunca no dia 1).
  const pivot = pick(STORMS);
  const off = 1 + Math.floor(rnd() * (R.DAYS - 2));
  const start = day0(pivot.d) - off * DAY;
  const storms = {};
  STORMS.forEach(e => {
    const i = Math.round((day0(e.d) - start) / DAY);
    if (i >= 1 && i < R.DAYS && (!storms[i] || e.sev > storms[i].sev)) storms[i] = e;
  });
  return { start, storms };
}

function discover(G, pool, n) {
  const got = [];
  for (let i = 0; i < n; i++) {
    const left = DISC.filter(d => !G.found.includes(d.id));
    if (!left.length) break;
    const same = left.filter(d => d.pool === pool);
    const d = pick(same.length ? same : left);
    G.found.push(d.id); got.push(d);
  }
  return got;
}

function bag(G, key, items) {
  if (!G.bags[key] || !G.bags[key].length) {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    G.bags[key] = a;
  }
  return G.bags[key].pop();
}

}

function newGame() {

  buildDay(G);

const locked = (G, opt) => G.pw + (opt.fx.pw || 0) < 0;

function apply(G, fx) {
  if (fx.pw) { const v = G.pw + fx.pw; if (v > R.PW_MAX) G.wasted += v - R.PW_MAX; G.pw = Math.max(0, Math.min(R.PW_MAX, v)); }
  if (fx.air) G.air = Math.max(0, Math.min(R.AIR_MAX, G.air + fx.air));
  if (fx.rad) G.rad += fx.rad;
  if (fx.sci) G.sci += fx.sci;
  if (fx.prepared) G.prepared = true;
  if (fx.rush) G.rush = true;
  if (fx.outside) { G.outside = true; G.trips++; G.tripRad += fx.rad || 0; }
}

function choose(G, side) {
  if (G.over) return null;

  if (!opt || locked(G, opt)) return null;
  apply(G, opt.fx);
  const out = { card: c, side: c.single ? 'R' : side, opt };
  if (opt.fx.sci) out.found = discover(G, opt.pool, opt.fx.sci);
  if (c.resolve) {
    const s = c.storm, dose = R.STORM[s.sev];
    const mode = G.prepared ? 'ready' : G.rush ? 'rush' : 'none';
    const block = mode === 'ready' ? R.BLOCK_READY : mode === 'rush' ? R.BLOCK_RUSH : 0;
    const inside = Math.round(dose * (1 - block));
    const extra = G.outside ? Math.round(dose * R.OUTSIDE) : 0;
    const m = { e: s, day: G.day, mode, block, inside, extra, outside: G.outside };
    G.rad += inside + extra; G.tripRad += extra;
    G.met.push(m);
    out.storm = m;
    G.queue.unshift(resultCard(m));
  }
  if (G.rad >= R.RAD_LIMIT) { G.over = 'rad'; G.card = null; return out; }
  if (!G.queue.length) {
    // Noite: a tripulação respira e os raios cósmicos continuam chegando.
    G.air -= R.AIR_USE; G.rad += R.RAD_DAILY;
    out.night = true;
    if (G.air <= 0) { G.air = 0; G.over = 'air'; G.card = null; return out; }
    if (G.rad >= R.RAD_LIMIT) { G.over = 'rad'; G.card = null; return out; }
    G.day++;
    if (G.day >= R.DAYS) { G.over = 'win'; G.card = null; return out; }
    buildDay(G);
  }
  const next = G.queue.shift();
  G.card = typeof next === 'function' ? next() : next;
  return out;
}

function stars(G) {
  if (G.over !== 'win') return 0;
  const a = G.sci >= R.SCI_GOAL, b = G.rad < R.RAD_SAFE;
  return a && b ? 3 : a || b ? 2 : 1;
}

      : `ALERT! At ${fmtTime(s.flr)} scientists saw an explosion${clsTxt(s.cls)} on the Sun. Dangerous particles may arrive soon!`;
    case 'arriveReady': return pt
      ? `As partículas do Sol chegaram, ${warnTxt(s.warn)} depois da explosão. O escudo está carregado!`
      : `The Sun's particles arrived, ${warnTxt(s.warn)} after the explosion. The shield is charged!`;
    case 'arriveLate': return pt
      ? `As partículas chegaram só ${warnTxt(s.warn)} depois da explosão, e o escudo não foi carregado! Ligado às pressas, ele bloqueia só metade.`
      : `The particles arrived just ${warnTxt(s.warn)} after the explosion, and the shield was not charged! Turned on in a rush, it blocks only half.`;
    case 'arriveSurprise': return pt

    case 'result': {

/* Ícones de efeito: setas em vez de números */
function fxIcons(fx) {
  const arrows = (n, per) => (n > 0 ? '▲' : '▼').repeat(Math.min(3, Math.max(1, Math.round(Math.abs(n) / per))));
  const p = [];
  if (fx.prepared || fx.rush) p.push('🛡️');
  if (fx.pw) p.push('⚡' + arrows(fx.pw, 1));
  if (fx.air) p.push('🫧' + arrows(fx.air, 1));
  if (fx.sci) p.push('🔬' + arrows(fx.sci, 1));
  if (fx.rad) p.push('☢️' + arrows(fx.rad, 5));
  return p.join(' ');
}

/* ---------- tempestade: partículas do Sol contra o escudo ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function playStorm(m) {
  const scene = $('scene');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !scene.animate) return;
  const sr = scene.getBoundingClientRect(), su = $('sun').getBoundingClientRect(), ba = $('base').getBoundingClientRect(), sh = $('shield').getBoundingClientRect();
  const x0 = su.left - sr.left + su.width / 2, y0 = su.top - sr.top + su.height / 2;
  const bx = ba.left - sr.left + ba.width / 2, by = ba.top - sr.top + ba.height * .6;
  const rad = sh.width / 2 + 2;
  scene.classList.add('storm');
  const n = 14 + m.e.sev * 10;
  let hits = 0;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'particle'; scene.appendChild(p);
    const tx = bx + (Math.random() - .5) * 60, ty = by + (Math.random() - .5) * 16;
    const blocked = Math.random() < m.block;
    let ex = tx, ey = ty;
    if (blocked) { const dx = tx - x0, dy = ty - y0, len = Math.hypot(dx, dy), k = (len - rad) / len; ex = x0 + dx * k; ey = y0 + dy * k; } else hits++;
    const a = p.animate([
      { transform: `translate(${x0}px, ${y0}px)`, opacity: 1 },
      { transform: `translate(${ex}px, ${ey}px)`, opacity: 1, offset: .85 },
      { transform: `translate(${ex}px, ${ey}px) scale(${blocked ? 2.4 : .4})`, opacity: 0 },
    ], { duration: 900, delay: i * 38, easing: 'ease-in', fill: 'both' });
    a.onfinish = () => p.remove();
  }
  await wait(700);
  if (hits) { $('base').classList.add('hit'); }
  await wait(n * 38 + 500);
  $('base').classList.remove('hit'); scene.classList.remove('storm');
}

/* ---------- jogar ---------- */
async function act(side) {
  if (busy || !G || G.over) return;
  const c = G.card, opt = c.single ? c.R : c[side];
  const card = $('card');
  if (locked(G, opt)) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); toast(t('locked')); sfx('lock'); lockHits++; tip(['locked']); return; }
  busy = true;
  const dir = side === 'L' ? -1 : 1;
  card.classList.add('fly'); card.style.transform = `translateX(${dir * 420}px) rotate(${dir * 24}deg)`;
  const out = choose(G, side);
  sfx(out.storm ? 'storm' : 'swipe');
  if (out.storm) { preview(null); await playStorm(out.storm); }
  else await wait(240);
  renderMeters();
  if (out.night && !G.over) toast('🌙 🫧▼  ☢️▲');
  if (G.over) { await wait(500); busy = false; return finish(); }
  if (out.found && out.found.length) {
    const f = out.found;
    showLearn(() => `<span>🔬 <b>${lang === 'pt' ? 'Nova descoberta' : 'New discovery'}: ${f.map(d => d.ico + ' ' + tr(d.name)).join(' + ')}</b><br>${tr(f[0].fact)}</span>`, true);
    sfx('disc');
  } else {
    const keys = [c.id + ':' + out.side];
    if (out.night) keys.push('night');
    if (G.card.kind === 'day' && G.card.sun === 1) keys.push('low');
    if (!tip(keys)) showLearn(null);
  }
  if (G.card.kind === 'flare') sfx('alert');
  renderCard(true);
  busy = false;
}

  if (has('none')) b.push(pt ? '☢️ Sem escudo, a tempestade atravessou a base. Um pouco de energia guardada teria ajudado.' : '☢️ With no shield, the storm went through the base. A little saved power would have helped.');
  if (G.trips) b.push(pt ? `🚙 Você saiu da base ${times(G.trips)}. Lá fora não há escudo: +${G.tripRad} de radiação.` : `🚙 You left the base ${times(G.trips)}. There is no shield outside: +${G.tripRad} radiation.`);
  if (lockHits) b.push(pt ? `🔒 Faltou energia ${times(lockHits)} para o que você queria. Não dá para ligar tudo ao mesmo tempo.` : `🔒 You ran short of power ${times(lockHits)} for what you wanted. You cannot turn everything on at once.`);
  if (G.wasted) b.push(pt ? `🔋 A bateria encheu e ${G.wasted} de energia do Sol se perdeu.` : `🔋 The battery filled up and ${G.wasted} of the Sun's power was lost.`);
  $('debrief').innerHTML = b.slice(0, 4).map(x => '<li>' + x + '</li>').join('');
  const found = G.found.map(id => DISC.find(d => d.id === id));
  $('bookTitle').textContent = (pt ? '📓 Caderno de descobertas' : '📓 Discovery notebook') + ` (${found.length})`;
  $('bookColl').textContent = prog ? (pt ? `Coleção neste aparelho: ${prog.n} de ${DISC.length} · Melhor missão: ${'⭐'.repeat(prog.best) || '—'}` : `Collection on this device: ${prog.n} of ${DISC.length} · Best mission: ${'⭐'.repeat(prog.best) || '—'}`) : '';
  $('book').innerHTML = found.length ? found.map(d => `<div class="d"><span class="i">${d.ico}</span><b>${tr(d.name)}</b><span>${tr(d.fact)}</span></div>`).join('')
    : `<p>${pt ? 'Nenhuma descoberta desta vez. O laboratório, o telescópio e o jipe fazem descobertas.' : 'No discoveries this time. The lab, the telescope and the rover make discoveries.'}</p>`;
  $('endFact').classList.toggle('hidden', found.length > 0);
  $('endFact').innerHTML = (pt ? '💡 <b>Você sabia?</b> ' : '💡 <b>Did you know?</b> ') + FACTS[factIdx % FACTS.length][pt ? 0 : 1];
  $('realIntro').textContent = pt
    ? `Sua missão aconteceu entre ${fmtDate(G.start)} e ${fmtDate(G.start + (R.DAYS - 1) * DAY)}. Nesses dias, o Sol fez isto de verdade:`
    : `Your mission took place between ${fmtDate(G.start)} and ${fmtDate(G.start + (R.DAYS - 1) * DAY)}. On those days, the Sun really did this:`;
  $('realList').innerHTML = Object.keys(G.storms).map(Number).sort((a, b) => a - b).map(i => {
    const s = G.storms[i], m = G.met.find(x => x.e === s);
    return `<div class="ev"><div class="when">${fmtDate(Date.parse(s.d))} · ${fmtTime(s.d)} UTC · ${pt ? 'tempestade' : 'storm'} ${sevTxt(s.sev)}</div>
      <div>${stormRecord(s)} <a href="${s.link}" target="_blank" rel="noopener">${pt ? 'Ver no DONKI' : 'See it on DONKI'}</a></div>
      <div class="you">🎮 ${stormYou(i, m)}</div></div>`;
  }).join('');
  $('srcBody').innerHTML = pt ? `
    <p><b>Dados reais:</b> ${STORMS.length} tempestades de partículas solares (eventos SEP) de 2024 e 2025, registradas no
      <a href="https://ccmc.gsfc.nasa.gov/tools/DONKI/" target="_blank" rel="noopener">DONKI</a> da NASA e baixadas pela <a href="https://api.nasa.gov/" target="_blank" rel="noopener">api.nasa.gov</a>.
      De cada uma usamos: a hora em que as partículas chegaram, a explosão solar ligada a ela (hora e classe) e a velocidade da nuvem de gás (CME).
      Os dados foram baixados antes e guardados no jogo: <b>não são ao vivo</b>. As horas estão em UTC (hora universal).</p>
    <p><b>Por que esses dados:</b> o tempo entre ver a explosão e a chegada das partículas é o tempo real que uma tripulação teria para se proteger. No jogo, esse aviso decide se dá para carregar o escudo.</p>
    <p><b>Força da tempestade:</b> “forte” = o satélite GOES, perto da Terra e da Lua, detectou partículas acima de 100 MeV; “média” = acima de 10 MeV; “fraca” = só sondas mais distantes detectaram.
      MeV mede a energia das partículas: quanto maior, mais fácil elas atravessam paredes.</p>
    <p><b>Simplificações:</b> os números de ar, energia e radiação são de jogo, não de engenharia. O “escudo” representa um abrigo protegido. Registros com menos de 48 horas de diferença contam como uma tempestade só.
      Quando o DONKI não liga nenhuma explosão a uma tempestade, o jogo mostra a tempestade sem aviso.</p>` : `
    <p><b>Real data:</b> ${STORMS.length} solar particle storms (SEP events) from 2024 and 2025, recorded in NASA's
      <a href="https://ccmc.gsfc.nasa.gov/tools/DONKI/" target="_blank" rel="noopener">DONKI</a> and downloaded through <a href="https://api.nasa.gov/" target="_blank" rel="noopener">api.nasa.gov</a>.
      From each one we use: the time the particles arrived, the solar flare linked to it (time and class) and the speed of the gas cloud (CME).
      The data was downloaded in advance and stored in the game: <b>it is not live</b>. Times are in UTC.</p>
    <p><b>Why this data:</b> the time between seeing the flare and the particles arriving is the real time a crew would have to take cover. In the game, that warning decides whether the shield can be charged.</p>
    <p><b>Storm strength:</b> "strong" = the GOES satellite, near Earth and the Moon, detected particles above 100 MeV; "medium" = above 10 MeV; "weak" = only more distant probes detected it.
      MeV measures particle energy: the higher it is, the more easily particles pass through walls.</p>
    <p><b>Simplifications:</b> the air, power and radiation numbers are game numbers, not engineering values. The "shield" stands for a protected shelter. Records less than 48 hours apart count as a single storm.
      When DONKI links no flare to a storm, the game shows that storm with no warning.</p>`;
}

/* ---------- eventos ---------- */
const card = $('card');
let drag = null;
card.addEventListener('pointerdown', e => { if (busy || !G || G.over) return; drag = { x: e.clientX, dx: 0 }; card.setPointerCapture(e.pointerId); card.classList.remove('snap', 'in', 'shake'); });
card.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dx = e.clientX - drag.x;
  card.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 16}deg)`;
  const side = drag.dx > 25 ? 'R' : drag.dx < -25 ? 'L' : null, k = Math.min(1, Math.abs(drag.dx) / 90);
  $('tagR').style.opacity = side === 'R' ? k : 0;
  $('tagL').style.opacity = side === 'L' && !G.card.single ? k : 0;
  preview(side);
});
const drop = () => {
  if (!drag) return;
  const dx = drag.dx; drag = null;
  if (Math.abs(dx) > 90) { act(dx > 0 ? 'R' : 'L'); if (!busy) { card.classList.add('snap'); card.style.transform = ''; preview(null); } }
  else { card.classList.add('snap'); card.style.transform = ''; $('tagL').style.opacity = 0; $('tagR').style.opacity = 0; preview(null); }
};
card.addEventListener('pointerup', drop); card.addEventListener('pointercancel', drop);
[['btnL', 'L'], ['btnR', 'R']].forEach(([id, s]) => {
  const b = $(id);
  b.addEventListener('click', () => act(s));
  b.addEventListener('pointerenter', () => { if (!busy) preview(s); });
  b.addEventListener('pointerleave', () => { if (!busy) preview(null); });
  b.addEventListener('focus', () => { if (!busy) preview(s); });
  b.addEventListener('blur', () => { if (!busy) preview(null); });
});
document.addEventListener('keydown', e => {
  if ($('game').classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft') act('L'); else if (e.key === 'ArrowRight') act('R');
});
$('muteBtn').addEventListener('click', () => { muted = !muted; store.set('lb_mute', muted ? '1' : '0'); setTexts(); if (!muted) sfx('swipe'); });
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', () => { factIdx++; start(); });
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = lang === 'pt' ? 'en' : 'pt'; setTexts();
  if (G) { renderMeters(); if (G.over) renderEnd(); else renderCard(false); }
}));
setTexts();
window.__game = { get G() { return G; }, R, STORMS, Engine, act, setLang: l => { lang = l; setTexts(); } };   // para testes
})();
</script>
</body>
</html>

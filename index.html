const R = {
  DAYS: 10,
  AIR_START: 6, AIR_MAX: 10, AIR_USE: 2,
  PW_START: 4, PW_MAX: 10, SUN: [3, 4, 2, 1, 2, 3, 4, 2, 1, 2],   // sombras das crateras do polo sul
  RAD_LIMIT: 100, RAD_SAFE: 50, RAD_DAILY: 2,
  SCI_GOAL: 8,
  STORM: { 1: 20, 2: 40, 3: 70 },
  BLOCK_READY: 0.9, BLOCK_RUSH: 0.5, OUTSIDE: 0.6,
  SHIELD_PW: 3,
};
const DAY = 864e5;
let rnd = Math.random;
const day0 = iso => Date.parse(iso.slice(0, 10) + 'T00:00:00Z');
const pick = a => a[Math.floor(rnd() * a.length)];
const B = (pt, en) => ({ pt, en });

function pickMission() {
  // Janela real de 10 dias com pelo menos uma tempestade (nunca no dia 1).
  const pivot = pick(STORMS);
  const off = 1 + Math.floor(rnd() * (R.DAYS - 2));
  const start = day0(pivot.d) - off * DAY;
  const storms = {};
  STORMS.forEach(e => {
    const i = Math.round((day0(e.d) - start) / DAY);
    if (i >= 1 && i < R.DAYS && (!storms[i] || e.sev > storms[i].sev)) storms[i] = e;
  });
  const dated = {};
  DATED_EVENTS.forEach(e => {
    const i = Math.round((day0(e.d) - start) / DAY);
    if (i >= 0 && i < R.DAYS && !storms[i]) dated[i] = e;
  });
  return { start, storms, dated };
}

function quizCard(discId) {
  const q = DISC_QUIZ[discId], d = DISC.find(x => x.id === discId);
  return {
    id: 'quiz_' + discId, kind: 'quiz', quiz: true, disc: d, art: q.art, text: q.text,
    L: { label: q.L.label, ok: q.L.ok, fx: {} },
    R: { label: q.R.label, ok: q.R.ok, fx: {} },
  };
}
/* Uma descoberta por dia. Dentro do grupo, as que ainda não estão no álbum (G.seen) têm o dobro de chance. */
const DISC_POOLS = ['rock', 'crater', 'ice', 'sun'];
function discover(G, pool) {
  if (G.discDay === G.day) return [];
  const left = DISC.filter(d => !G.found.includes(d.id));
  if (!left.length) return [];
  const same = left.filter(d => d.pool === pool);
  const options = same.length ? same : left;
  const weights = options.map(d => G.seen.includes(d.id) ? 1 : 2);
  let r = rnd() * weights.reduce((a, b) => a + b, 0), i = 0;
  while (r >= weights[i] && i < options.length - 1) r -= weights[i++];
  const d = options[i];
  G.found.push(d.id);
  G.discDay = G.day;
  if (DISC_QUIZ[d.id] && !G.recall.some(x => x.id === d.id)) {
    G.recall.push({ id: d.id, dueDay: G.day + 1 + Math.floor(rnd() * Math.min(4, Math.max(1, R.DAYS - 1 - G.day))) });
  }
  return [d];
}

function bag(G, key, items) {
  if (!G.bags[key] || !G.bags[key].length) {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    G.bags[key] = a;
  }
  return G.bags[key].pop();
}
function buildDay(G) {
  const s = G.storms[G.day];
  const dEv = G.dated[G.day];
  G.prepared = false; G.rush = false; G.outside = false;
  const q = [dayCard(G)];
  q.push(G.air <= R.AIR_USE ? LIFE[0] : pick(LIFE.flatMap(c => Array(c.w).fill(c))));
  if (s && s.flr) q.push(flareCard(s));
  q.push(s ? (s.flr ? ROVER_ALERT : LAB) : bag(G, 'sci', [LAB, ROVER]));
  const due = G.recall.filter(item => item.dueDay <= G.day);
  if (due.length) {
    const item = pick(due);
    G.recall.splice(G.recall.indexOf(item), 1);
    q.splice(1 + Math.floor(rnd() * q.length), 0, quizCard(item.id));
  }
  if (s) {
    q.push(() => arrivalCard(G, s));
  } else if (dEv) {
    G.realLog.push({ day: G.day, ev: dEv });
    q.push(dEv);
  } else {
    q.push(bag(G, 'ev', EVENTS));
  }
  G.queue = q;
}

// seen: ids das descobertas que o jogador já tem no álbum (vem do navegador; no Node fica vazio).
function newGame(seen = []) {
  const m = pickMission();
  const G = { day: 0, air: R.AIR_START, pw: R.PW_START, rad: 0, sci: 0, start: m.start, storms: m.storms, dated: m.dated || {},
              phase: Math.floor(rnd() * R.SUN.length), bags: {}, met: [], over: null, card: null, queue: [], wasted: 0, found: [], trips: 0, tripRad: 0, realLog: [], recall: [],
              seen: [...seen], discDay: -1 };
  buildDay(G);
  G.card = G.queue.shift();
  return G;
}

const effectFor = (G, opt) => opt.adjust ? { ...opt.fx, ...opt.adjust(G) } : opt.fx;
const locked = (G, opt) => G.pw + (effectFor(G, opt).pw || 0) < 0;

function apply(G, fx) {
  if (fx.pw) { const v = G.pw + fx.pw; if (v > R.PW_MAX) G.wasted += v - R.PW_MAX; G.pw = Math.max(0, Math.min(R.PW_MAX, v)); }
  if (fx.air) G.air = Math.max(0, Math.min(R.AIR_MAX, G.air + fx.air));
  if (fx.rad) G.rad += fx.rad;
  if (fx.sci) G.sci += fx.sci;
  if (fx.prepared) G.prepared = true;
  if (fx.rush) G.rush = true;
  if (fx.outside) { G.outside = true; G.trips++; G.tripRad += fx.rad || 0; }
}

function choose(G, side) {
  if (G.over) return null;
  const c = G.card, opt = c.single ? c.R : c[side];
  if (!opt || locked(G, opt)) return null;
  const known = effectFor(G, opt);
  const fx = opt.resolveFx ? { ...known, ...opt.resolveFx() } : known;
  apply(G, fx);
  const out = { card: c, side: c.single ? 'R' : side, opt, fx };
  if (c.quiz) {

async function act(side) {
  if (busy || !G) return;
  if (discoveryReveal.length) {
    busy = true;
    flyCard(side);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) await wait(240);
    discoveryReveal = [];
    busy = false;
    if (G.over) return finish();
    if (G.card.kind === 'flare') sfx('alert');
    renderCard(true);
    $('card').focus();
    return;
  }
  if (G.over) return;
  const c = G.card, opt = c.single ? c.R : c[side];
  const card = $('card');
  if (locked(G, opt)) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); toast(t('locked')); sfx('lock'); lockHits++; tip(['locked']); return; }
  busy = true;
  flyCard(side);
  const out = choose(G, side);
  sfx(out.storm ? 'storm' : 'swipe');
  preview(null);
  await playTaskScene(out);
  renderMeters();
  if (out.night && !G.over) toast('🌙 🫧▼  ☢️▲');
  if (out.found?.length) {
    const unlocked = new Set(getUnlocked());
    discoveryReveal = out.found.map(entry => ({ entry, first: !unlocked.has(entry.id), night: !!out.nightDisc }));
    for (const { entry } of discoveryReveal) unlocked.add(entry.id);
    store.set('lb_disc', JSON.stringify([...unlocked]));
    preview(null);
    showLearn(null);
    renderDiscovery();
    sfx('disc');
    busy = false;
    $('btnR').focus();
    return;
  }
  if (G.over) { await wait(500); busy = false; return finish(); }
  if (out.opt.hidden) {
    showLearn(() => '<span>' + (out.fx.sci
      ? tr({pt: 'O sinal trouxe dados úteis para o laboratório.', en: 'The signal gave the lab useful data.'})
      : tr({pt: 'O sinal não trouxe dados úteis. A análise gastou energia.', en: 'The signal held no useful data. Analyzing it used power.'})) + '</span>');
  } else {
    const keys = [c.id + ':' + out.side];
    if (out.night) keys.push('night');
    if (G.card.kind === 'day' && G.card.sun === 1) keys.push('low');
    if (!tip(keys)) showLearn(null);
  }
  if (c.quiz) {
    if (out.quizOk) {
      showLearn(() => `<span>🎉 <b>${lang === 'pt' ? 'Você lembrou! A solução recupera ar e reduz radiação, com um pequeno custo de energia.' : 'You remembered! Your solution restores air and reduces radiation at a small power cost.'}</b><br>${tr(c.disc.fact)}</span>`, true);
      sfx('disc');
    } else {
      showLearn(() => `<span>🤔 <b>${lang === 'pt' ? 'Quase! A base gastou um pouco de ar e energia.' : 'Close! The base spent a little air and power.'}</b><br>${tr(c.disc.fact)}</span>`, false);
    }
  }
  if (G.card.kind === 'flare') sfx('alert');
  renderCard(true);
  busy = false;
}

function start() {
  busy=false; lunarScene.reset();
  discoveryReveal = []; G = newGame(getUnlocked()); lockHits = 0; prog = null; showLearn(null);
  $('intro').classList.add('hidden'); $('end').classList.add('hidden'); $('game').classList.remove('hidden');
  renderMeters(); renderCard(true);

}

const card = $('card');
let drag = null;
function dragLimit() {
  const deck = $('deck').getBoundingClientRect();
  const center = (deck.left + deck.right) / 2;
  const viewportRoom = Math.min(center, document.documentElement.clientWidth - center);
  const deckRoom = deck.width / 2 + 26;
  return Math.max(0, Math.min(deckRoom, viewportRoom) - card.offsetWidth / 2 - 2);
}
function moveCard(offset) {
  const limit = dragLimit();
  const angle = Math.sign(offset) * Math.min(8, Math.abs(offset) / 16, limit * 90 / (Math.PI * card.offsetHeight));
  const rotationRoom = card.offsetHeight * Math.abs(Math.sin(angle * Math.PI / 180)) / 2;
  const travel = Math.max(0, limit - rotationRoom);
  const x = Math.max(-travel, Math.min(travel, offset));
  card.style.transform = `translateX(${x}px) rotate(${angle}deg)`;
}

function flyCard(side) {
  card.classList.add('fly');
  moveCard(side === 'L' ? -120 : 120);
}

function resetDrag() {
  card.classList.add('snap');
  card.style.transform = '';
  $('tagL').style.opacity = $('tagR').style.opacity = 0;
  preview(null);
}

card.addEventListener('pointerdown', event => {
  if (busy || !G || (G.over && !discoveryReveal.length) || !event.isPrimary || event.button !== 0) return;
  drag = { id: event.pointerId, x: event.clientX };
  card.setPointerCapture(event.pointerId);
  card.classList.remove('snap', 'in', 'shake');
});
card.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  const offset = event.clientX - drag.x;
  moveCard(offset);
  if (discoveryReveal.length) return;
  const side = offset > 25 ? 'R' : offset < -25 ? 'L' : null;
  const opacity = Math.min(1, Math.abs(offset) / 90);
  $('tagR').style.opacity = side === 'R' ? opacity : 0;
  $('tagL').style.opacity = side === 'L' && !G.card.single ? opacity : 0;
  preview(side);
});
const drop = event => {
  if (drag?.id !== event.pointerId) return;
  const offset = event.clientX - drag.x;
  drag = null;
  if (event.type === 'pointerup' && Math.abs(offset) > Math.max(22, Math.min(60, dragLimit() * .85))) {
    act(offset > 0 ? 'R' : 'L');
    if (busy) return;
  }
  resetDrag();
};
card.addEventListener('pointerup', drop); card.addEventListener('pointercancel', drop); card.addEventListener('lostpointercapture', drop);
[['btnL', 'L'], ['btnR', 'R']].forEach(([id, s]) => {
  const b = $(id);
  b.addEventListener('click', () => act(s));
  b.addEventListener('pointerenter', () => { if (!busy) preview(s); });
  b.addEventListener('pointerleave', () => { if (!busy) preview(null); });
  b.addEventListener('focus', () => { if (!busy) preview(s); });
  b.addEventListener('blur', () => { if (!busy) preview(null); });
});
document.addEventListener('keydown', e => {
  if ($('game').classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft') act('L'); else if (e.key === 'ArrowRight') act('R');
});
$('openAlbumBtn').addEventListener('click', () => openAlbum('intro'));
$('albumGameBtn').addEventListener('click', () => {
  if (busy || !G || G.over || (G.card && G.card.quiz)) return;
  openAlbum('game');
});
$('closeAlbumBtn').addEventListener('click', () => {
  $('album').classList.add('hidden');
  $(albumFrom).classList.remove('hidden');
});
$('muteBtn').addEventListener('click', () => { muted = !muted; store.set('lb_mute', muted ? '1' : '0'); setTexts(); if (!muted) sfx('swipe'); });
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', () => { factIdx++; start(); });
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = lang === 'pt' ? 'en' : 'pt'; setTexts();
  if (!$('album').classList.contains('hidden')) openAlbum();
  if (G && !busy && !discoveryReveal.length) { renderMeters(); if (G.over) renderEnd(); else renderCard(false); }
}));
setTexts();
window.__game = { get G() { return G; }, get busy() { return busy; }, lunarScene, R, STORMS, Engine, act, setLang: l => { lang = l; setTexts(); } };   // para testes
})();
</script>

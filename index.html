function sample(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

function pickMission() {
  // Sorteia 2 a 3 tempestades reais (dias 2 a 10) e até 2 eventos datados nos dias livres.
  const stormDaysPool = Array.from({ length: R.DAYS - 1 }, (_, i) => i + 1);
  const stormCount = 1 + Math.floor(rnd() * 3);
  const stormDays = sample(stormDaysPool, stormCount);
  const chosenStorms = sample(STORMS, stormCount);
  const storms = {};
  stormDays.forEach((d, idx) => { storms[d] = chosenStorms[idx]; });

  const freeDays = Array.from({ length: R.DAYS }, (_, i) => i).filter(i => !storms[i]);
  const eventCount = Math.min(freeDays.length, DATED_EVENTS.length, Math.floor(rnd()*3));
  const eventDays = sample(freeDays, eventCount);
  const chosenEvents = sample(DATED_EVENTS, eventCount);
  const dated = {};
  eventDays.forEach((d, idx) => { dated[d] = chosenEvents[idx]; });

  return { storms, dated };
}

// Pergunta da carta de pesquisa. Cada opção tem o verbo no infinitivo, para a pergunta ficar natural.
const ASK = {
  lab: ['pesquisar pedras', 'study rocks'], scope: ['observar o Sol', 'watch the Sun'],
  rover: ['ver crateras', 'see craters'], ice: ['buscar gelo', 'get ice'],
  rest: ['recarregar as baterias', 'recharge the batteries'],
};
function sciText(a, b, s) {
  const x = ASK[a], y = ASK[b];
  const q = B(`Você deseja ${x[0]} ou ${y[0]}?`, `Do you want to ${x[1]} or ${y[1]}?`);
  const lead = a === 'rest' ? B('A energia está baixa.', 'Power is low.')
    : s && s.flr ? B('Há alerta solar ligado.', 'A solar alert is on.')
    : s ? null : B('Está na hora da pesquisa!', 'It\'s research time!');
  return lead ? B(`${lead.pt} ${q.pt}`, `${lead.en} ${q.en}`) : q;
}
// Montada na hora em que aparece, para o resgate olhar a energia já com o Sol do dia.
function sciCard(G, s) {
  let inside = pick(['lab', 'scope']), outside;
  if (s && !s.flr) outside = inside === 'lab' ? 'scope' : 'lab';   // tempestade sem aviso: sair seria injusto
  else outside = s ? 'roverAlert' : pick(['rover', 'ice']);        // dia de alerta: a tentação é o jipe
  if (G.pw <= R.RESCUE_PW) inside = 'rest';
  const a = SCI[inside], b = SCI[outside];
  return { id: 'sci', kind: 'sci', art: a.art + b.art, pair: [inside, outside], warn: !!(s && s.flr),
    text: sciText(a.key, b.key, s),
    L: a, R: b };
}

    ? tr({pt: '🌙 Diário de bordo: revisando os dados do dia, a equipe descobriu algo · ', en: '🌙 Logbook: reviewing the day\'s data, the crew discovered something · '}) : '';

async function act(side) {
  startMusic();
  if (busy || !G) return;
  if (discoveryReveal.length) {
    busy = true;
    flyCard(side);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) await wait(240);
    discoveryReveal = [];
    busy = false;
    if (G.over) return finish();
    if (G.card.kind === 'flare') sfx('alert');
    renderCard(true);
    $('card').focus();
    return;
  }
  if (G.over) return;
  const c = G.card, opt = c.single ? c.R : c[side];
  const card = $('card');
  if (locked(G, opt)) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); toast(t('locked')); sfx('lock'); lockHits++; tip(['locked']); return; }
  busy = true;
  flyCard(side);
  const out = choose(G, side);
  sfx(out.storm ? 'storm' : c.kind === 'day' ? 'shift' : 'swipe');
  preview(null);
  await playTaskScene(out);
  renderMeters();
  if (out.found?.length) {
    const unlocked = new Set(getUnlocked());
    discoveryReveal = out.found.map(entry => ({ entry, first: !unlocked.has(entry.id), night: !!out.nightDisc }));
    for (const { entry } of discoveryReveal) unlocked.add(entry.id);
    store.set('lb_disc', JSON.stringify([...unlocked]));
    preview(null);
    showLearn(null);
    renderDiscovery();
    sfx(discoveryReveal.some(item => item.first) ? 'reveal' : 'disc');
    busy = false;
    $('btnR').focus();
    return;
  }
  if (G.over) { await wait(500); busy = false; return finish(); }
  if (out.opt.hidden) {
    showLearn(() => '<span>' + (out.fx.sci
      ? tr({pt: 'O sinal trouxe dados úteis para o laboratório.', en: 'The signal gave the lab useful data.'})
      : tr({pt: 'O sinal não trouxe dados úteis. A análise gastou energia.', en: 'The signal held no useful data. Analyzing it used power.'})) + '</span>');
  } else {
    const keys = [c.kind === 'sci' ? 'sci:' + out.opt.key : c.id + ':' + out.side];
    if (out.night) keys.push('night');
    if (G.card.kind === 'day' && G.card.sun === 1) keys.push('low');
    if (!tip(keys)) showLearn(null);
  }
  if (c.quiz) {
    if (out.quizOk) {
      showLearn(() => `<span>🎉 <b>${lang === 'pt' ? 'Você lembrou! A solução recupera ar, com um pequeno custo de energia.' : 'You remembered! Your solution restores air and reduces radiation at a small power cost.'}</b><br>${tr(c.disc.fact)}</span>`, true);
      sfx('disc');
    } else {
      showLearn(() => `<span><b>${tr({pt:'Quase! A base gastou um pouco de ar e energia.', en:'Close! The base spent a little air and power.'})}</b><br>${tr(c.disc.fact)} ${G.card.quiz ? '' : `<button class="study-review" type="button" data-review="${c.disc.id}">${tr({pt:'Rever no painel',en:'Review in terminal'})}</button>`}</span>`, false);
    }
  }
  if (G.card.kind === 'flare') sfx('alert');
  renderCard(true);
  busy = false;
}

function start(eventCard, reviewPreview = false) {
  busy=false; lunarScene.reset();
  discoveryReveal = []; G = newGame(eventCard, getUnlocked()); lockHits = 0; prog = null; showLearn(null);
  if (reviewPreview) {
    G.found.push('bones');
    G.queue.unshift(Engine.quizCard('bones'));
  }
  if (eventCard) {
    G.queue = G.queue.filter(card => card !== eventCard);
    G.card = eventCard;
    G.pw = R.PW_MAX;
  }
  $('intro').classList.add('hidden'); $('end').classList.add('hidden'); $('game').classList.remove('hidden');
  renderMeters(); renderCard(true);
  if (!seen.has('hint')) { seen.add('hint'); $('card').classList.add('hint'); }
  window.scrollTo(0, 0);
}

function fxTxt(fx) {
  const pt = lang === 'pt', sg = n => (n > 0 ? '+' : '') + n, parts = [];
  if (fx.pw) parts.push(`${pt ? 'energia' : 'power'} ${sg(fx.pw)}`);
  if (fx.air) parts.push(`${pt ? 'ar' : 'air'} ${sg(fx.air)}`);
  if (fx.rad) parts.push(`${pt ? 'radiação' : 'radiation'} ${sg(fx.rad)}`);
  if (fx.sci) parts.push(`${pt ? 'descobertas' : 'discoveries'} ${sg(fx.sci)}`);
  return (pt ? 'Efeito: ' : 'Effect: ') + (parts.join(', ') || (pt ? 'nenhum' : 'none'))
       + (fx.outside ? (pt ? ' (lá fora, sem escudo)' : ' (outside, no shield)') : '');
}

/* Até 3 fatos da missão, em ordem cronológica. Prioridade: tempestades mal preparadas,
   eventos reais escolhidos pelo jogador, depois tempestades bem preparadas. */
function missionFacts(G) {
  const pt = lang === 'pt', items = [];
  for (const m of G.met) {
    const s = m.e, dose = m.inside + m.extra, warned = !!s.flr;
    const how = m.mode === 'ready' ? (pt ? 'Você carregou o escudo a tempo (bloqueou 90%)' : 'You charged the shield in time (it blocked 90%)')
      : m.mode === 'rush' ? (pt ? 'Você ligou o escudo às pressas (bloqueou só 50%)' : 'You turned the shield on in a rush (it blocked only 50%)')
      : (pt ? 'Você não ligou o escudo' : 'You did not turn the shield on');
    const tip = m.mode === 'ready' ? (pt ? 'Bem feito: com o aviso, carregar o escudo protegeu a tripulação.' : 'Well done: with the warning, charging the shield protected the crew.')
      : m.mode === 'rush' ? (pt ? 'Com o aviso curto, carregue o escudo assim que o alerta chegar: ele bloqueia 90%, não 50%.' : 'With a short warning, charge the shield as soon as the alert arrives: it blocks 90%, not 50%.')
      : warned ? (pt ? 'O aviso chega antes das partículas. Carregar o escudo nesse intervalo protege a base.' : 'The warning comes before the particles. Charging the shield in that window protects the base.')
      : (pt ? 'Esta tempestade não teve aviso. Manter energia guardada permite carregar o escudo a qualquer momento.' : 'This storm came with no warning. Keeping power in reserve lets you charge the shield at any time.');
    items.push({
      day: m.day, rank: m.mode === 'ready' ? 1 : 3, dose,
      when: `${pt ? 'Dia' : 'Day'} ${m.day + 1}: ${pt ? 'tempestade solar' : 'solar storm'} ${sevTxt(s.sev)}`,
      real: '',
      you: how + (m.outside ? (pt ? ', com o jipe lá fora' : ', with the rover outside') : '') + '.',
      effect: (pt ? 'Efeito: radiação ' : 'Effect: radiation ') + `+${dose}.`,
      tip,
    });
  }
  for (const p of G.picks || []) {
    const ev = p.ev, opt = ev[p.side];
    items.push({
      day: p.day, rank: 2, dose: 0,
      when: `${pt ? 'Dia' : 'Day'} ${p.day + 1}`,
      real: tr(ev.text),
      you: (pt ? 'Você escolheu: ' : 'You chose: ') + tr(opt.label) + '.',
      effect: fxTxt(p.fx),
      tip: tr(LESSON_DATED[ev.id]),
    });
  }
  items.sort((a, b) => b.rank - a.rank || b.dose - a.dose);
  return items.slice(0, 3).sort((a, b) => a.day - b.day);
}

const card = $('card');
let drag = null;
function dragLimit() {
  const deck = $('deck').getBoundingClientRect();
  const center = (deck.left + deck.right) / 2;
  const viewportRoom = Math.min(center, document.documentElement.clientWidth - center);
  const deckRoom = deck.width / 2 + 26;
  return Math.max(0, Math.min(deckRoom, viewportRoom) - card.offsetWidth / 2 - 2);
}
function moveCard(offset) {
  const limit = dragLimit();
  const angle = Math.sign(offset) * Math.min(8, Math.abs(offset) / 16, limit * 90 / (Math.PI * card.offsetHeight));
  const rotationRoom = card.offsetHeight * Math.abs(Math.sin(angle * Math.PI / 180)) / 2;
  const travel = Math.max(0, limit - rotationRoom);
  const x = Math.max(-travel, Math.min(travel, offset));
  card.style.transform = `translateX(${x}px) rotate(${angle}deg)`;
}
function flyCard(side) {
  card.classList.add('fly');
  moveCard(side === 'L' ? -120 : 120);
}

function resetDrag() {
  card.classList.add('snap');
  card.style.transform = '';
  $('tagL').style.opacity = $('tagR').style.opacity = 0;
  preview(null);
}

card.addEventListener('pointerdown', event => {
  if (busy || !G || G.over || discoveryReveal.length || !event.isPrimary || event.button !== 0) return;
  drag = { id: event.pointerId, x: event.clientX };
  card.setPointerCapture(event.pointerId);
  card.classList.remove('snap', 'in', 'shake');
});
card.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  const offset = event.clientX - drag.x;
  moveCard(offset);
  if (discoveryReveal.length) return;
  const side = offset > 25 ? 'R' : offset < -25 ? 'L' : null;
  const opacity = Math.min(1, Math.abs(offset) / 90);
  $('tagR').style.opacity = side === 'R' ? opacity : 0;
  $('tagL').style.opacity = side === 'L' ? opacity : 0;
  preview(side);
});
const drop = event => {
  if (drag?.id !== event.pointerId) return;
  const offset = event.clientX - drag.x;
  drag = null;
  if (event.type === 'pointerup' && Math.abs(offset) > Math.max(22, Math.min(60, dragLimit() * .85))) {
    act(offset > 0 ? 'R' : 'L');
    if (busy) return;
  }
  resetDrag();
};
card.addEventListener('pointerup', drop); card.addEventListener('pointercancel', drop); card.addEventListener('lostpointercapture', drop);
[['btnL', 'L'], ['btnR', 'R']].forEach(([id, s]) => {
  const b = $(id);
  b.addEventListener('click', () => act(s));
  b.addEventListener('pointerenter', () => { if (!busy) preview(s); });
  b.addEventListener('pointerleave', () => { if (!busy) preview(null); });
  b.addEventListener('focus', () => { if (!busy) preview(s); });
  b.addEventListener('blur', () => { if (!busy) preview(null); });
});

  const item = e => '<div class="d"><span class="i">' + icon(e) + '</span><b>' + tr(e.name) + '</b><span>' + tr(e.text) + '</span>'
    + (e.more ? '<small class="base">' + tr(e.more) + '</small>' : '') + '</div>';
  const block = (title, list, intro) => '<h2>' + tr(title) + '</h2>' + (intro ? '<p class="coll">' + tr(intro) + '</p>' : '')
    + '<div class="book">' + list.map(item).join('') + '</div>';
  $('tutorialBody').innerHTML = '<div class="fact">' + tr(T.goal) + '</div>'
    + block(T.goalH, T.stars) + block(T.resH, T.res) + block(T.hudH, T.hud) + block(T.dayH, T.day)
    + block(T.decH, T.dec) + block(T.stormH, T.storm, T.stormIntro) + block(T.cardsH, T.cards)
    + block(T.discH, T.disc) + block(T.tipsH, T.tips);
}
function openTutorial() {
  if ($('closeTutorialBtn').disabled) return;
  const opening = $('tutorial').classList.contains('hidden');
  $('intro').classList.add('hidden');
  $('tutorial').classList.remove('hidden');
  if (opening) { animateStudy($('tutorial')); sfx('windowOpen'); }
  $('closeTutorialBtn').setAttribute('aria-label', lang === 'pt' ? 'Fechar tutorial' : 'Close tutorial');
  $('closeTutorialBtn').textContent = lang === 'pt' ? '← Voltar' : '← Back';
  renderTutorial();
  window.scrollTo(0, 0);
}
$('openTutorialBtn').addEventListener('click', openTutorial);
$('closeTutorialBtn').addEventListener('click', async () => {
  const close = $('closeTutorialBtn');
  if (close.disabled) return;
  close.disabled = true;
  sfx('windowClose');
  await animateStudy($('tutorial'), true);
  $('tutorial').classList.add('hidden');
  $('intro').classList.remove('hidden');
  close.disabled = false;
  $('openTutorialBtn').focus();
});

$('albumGameBtn').addEventListener('click', () => {
  if (busy || !G || G.over || (G.card && G.card.quiz)) return;
  openAlbum('game');
});
function animateStudy(element, closing = false) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !element.animate) return Promise.resolve();
  const frames = [{opacity:0, transform:'translateY(-5px) scale(.97)'}, {opacity:1, transform:'none'}];
  const animation = element.animate(closing ? frames.reverse() : frames, {
    duration: closing ? 130 : 180, easing:'ease-out'
  });
  return animation.finished.catch(() => {});
}
$('learn').addEventListener('click', event => {
  const button = event.target.closest('[data-review]');
  if (!button || busy || G?.card?.quiz) return;
  openAlbum('game');
  $('albumGrid').querySelector('[data-study="' + button.dataset.review + '"]')?.click();
});
document.querySelector('main').addEventListener('dragstart', event => {
  if (event.target instanceof HTMLImageElement) event.preventDefault();
});
const studyWindows = $('studyWindows');
let studyDepth = 5;
function placeStudy(panel, x, y) {
  const desktop = $('album').getBoundingClientRect();
  panel.style.width = Math.min(360, desktop.width - 12) + 'px';
  const right = desktop.right - panel.offsetWidth - 6;
  panel.style.left = Math.max(desktop.left + 6, Math.min(right, x)) + 'px';
  panel.style.top = Math.max(0, Math.min(innerHeight - panel.offsetHeight, y)) + 'px';
}
$('albumGrid').addEventListener('click', event => {
  if ($('closeAlbumBtn').disabled) return;
  const file = event.target.closest('[data-study]');
  if (!file) return;
  const id = file.dataset.study;
  const wasUnread = !readDiscoveries.has(id);
  readDiscoveries.add(id);
  file.querySelector('.badgeNew')?.remove();
  store.set('lb_read_discoveries', JSON.stringify([...readDiscoveries]));
  updateStudyAttention();
  const existing = $('open-study-' + id);
  if (existing) {
    existing.style.zIndex = ++studyDepth;
    existing.querySelector('button').focus();
    return;
  }
  const entry = DISC.find(discovery => discovery.id === id);
  const panel = document.createElement('section');
  panel.id = 'open-study-' + id;
  panel.className = 'study-window';
  panel.setAttribute('aria-label', tr(entry.name));
  panel.innerHTML = '<div class="report-bar study-handle"><strong></strong><button class="pc-close" type="button"></button></div><div class="study-body"></div>';
  panel.querySelector('strong').textContent = tr(entry.name);
  panel.querySelector('.study-body').append($('study-' + id).content.cloneNode(true));
  const close = panel.querySelector('button');
  close.setAttribute('aria-label', lang === 'pt' ? 'Fechar arquivo' : 'Close file');
  close.onclick = async () => {
    close.disabled = true;
    sfx('windowClose');
    await animateStudy(panel, true);
    panel.remove();
    file.focus();
  };
  studyWindows.append(panel);
  const offset = ((studyWindows.childElementCount - 1) % 5) * 24;
  const desktop = $('album').getBoundingClientRect();
  placeStudy(panel, desktop.left + 12 + offset, innerHeight * .52 + offset);
  const raise = () => { panel.style.zIndex = ++studyDepth; };
  panel.addEventListener('pointerdown', raise);
  panel.addEventListener('focusin', raise);
  const handle = panel.querySelector('.study-handle');
  let origin;
  handle.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || event.target.closest('button')) return;
    const bounds = panel.getBoundingClientRect();
    origin = {x:event.clientX - bounds.left, y:event.clientY - bounds.top};
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', event => {
    if (origin && handle.hasPointerCapture(event.pointerId)) {
      placeStudy(panel, event.clientX - origin.x, event.clientY - origin.y);
    }
  });
  handle.addEventListener('lostpointercapture', () => { origin = null; });
  raise();
  animateStudy(panel);
  sfx('windowOpen');
});
window.addEventListener('resize', () => {
  for (const panel of studyWindows.children) {
    const bounds = panel.getBoundingClientRect();
    placeStudy(panel, bounds.left, bounds.top);
  }
});
$('closeAlbumBtn').addEventListener('click', async () => {
  const close = $('closeAlbumBtn');
  if (close.disabled) return;
  close.disabled = true;
  sfx('windowClose');
  await Promise.all([animateStudy($('album'), true),
    ...Array.from(studyWindows.children, panel => animateStudy(panel, true))]);
  studyWindows.replaceChildren();
  $('album').classList.add('hidden');
  $(albumFrom).classList.remove('hidden');
  close.disabled = false;
  $(albumFrom === 'game' ? 'albumGameBtn' : 'openAlbumBtn').focus();
});
$('muteBtn').addEventListener('click', () => { muted = !muted; store.set('lb_mute', muted ? '1' : '0'); setTexts(); if (muted) { stopMusic(); syncSceneAudio(false, wasFallen); } else { sfx('swipe'); startMusic(); } });
$('startBtn').addEventListener('click', () => start());
$('againBtn').addEventListener('click', () => { factIdx++; start(); });
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = lang === 'pt' ? 'en' : 'pt'; setTexts();
  if (!$('album').classList.contains('hidden')) openAlbum();
  if (!$('tutorial').classList.contains('hidden')) renderTutorial();
  if (G && !busy && !discoveryReveal.length) { renderMeters(); if (G.over) renderEnd(); else renderCard(false); }
}));
setTexts();
window.__game = { get G() { return G; }, get busy() { return busy; }, lunarScene, R, STORMS, Engine, act, setLang: l => { lang = l; setTexts(); } };   // para testes
if (new URLSearchParams(location.search).get('teste') === 'revisao') start(undefined, true);
const testEventId = new URLSearchParams(location.search).get('evento');
const previewStorm = Engine.STORMS.find(storm => storm.flr);
const testEvent = testEventId === 'tempestade-solar' && previewStorm
  ? { ...Engine.arrivalCard({prepared:false}, previewStorm), d:previewStorm.d }
  : Engine.DATED_EVENTS.find(event => event.id === testEventId);
if (testEvent) start(testEvent);
})();
</script>
